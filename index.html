<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRE Vocabulary • KhanLyon</title><style>body{font:16px system-ui;background:#f5f7fb;color:#17243b;margin:0}header{background:#152c52;color:white;padding:22px 18px}main{max-width:900px;margin:auto;padding:16px}.stats,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}button{cursor:pointer}.active{background:#234d88;color:white}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 9px #182c4412}.word{font-size:23px;font-weight:750}.bn{font-size:19px;color:#24548b;margin:8px 0}.muted{color:#5c6c81}.stats span{background:white;padding:10px;border-radius:9px}input{box-sizing:border-box;width:100%}small{color:#64748b}label{display:block;margin:8px 0}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header><h1>GRE Vocabulary</h1><div>English • বাংলা অর্থ • Synonyms • Revision tracker</div></header><main><div class="stats" id="stats"></div><input id="search" placeholder="Search English, বাংলা or synonym…"><div class="filters" id="filters"></div><article class="card" id="practice"><h2>Adaptive practice</h2><button id="startRound">Start 5-question round</button><div id="quiz"></div></article><section id="cards"></section><div class="card"><h3>Add a new word</h3><label>Word<input id="newword" placeholder="e.g. obdurate"></label><label>বাংলা অর্থ<input id="newbn" placeholder="বাংলা অর্থ"></label><label>GRE synonyms<input id="newsyn" placeholder="comma-separated synonyms"></label><button onclick="addWord()">Add word</button><p><small>Personal additions and revision progress are saved in this browser. Export a backup before changing devices or clearing browser data.</small></p><button onclick="exportData()">Export my data</button> <label style="display:inline-block">Import backup <input style="width:210px" type="file" accept=".json" onchange="importData(event)"></label></div></main><footer>Built for KhanLyon • GRE preparation</footer><script>
const starter=[["retaliation","প্রতিশোধ","reprisal,vengeance"],["rhetoric","বাগ্মিতা; প্রভাবশালী ভাষা","oratory,eloquence"],["intriguing","কৌতূহলোদ্দীপক; চক্রান্তকারী (প্রসঙ্গভেদে)","fascinating,engaging"],["aggrandize","ক্ষমতা বা মর্যাদা বৃদ্ধি করা","magnify,exalt"],["reconcile","মিটমাট করা; সামঞ্জস্য করা","harmonize,resolve"],["conceal","লুকানো","hide,disguise"],["manipulate","কৌশলে নিয়ন্ত্রণ করা","influence,exploit"],["conspire","ষড়যন্ত্র করা","collude,plot"],["wizened","বয়সে কুঁচকানো; শীর্ণ","wrinkled,shriveled"],["doleful","বিষণ্ণ","mournful,melancholy"],["wistful","আকুল আকাঙ্ক্ষাময়; বিষণ্ণ","yearning,nostalgic"],["baleful","অশুভ; ক্ষতিকর","menacing,malignant"],["fanciful","কল্পনাপ্রসূত","imaginative,unrealistic"],["fruitful","ফলপ্রসূ","productive,rewarding"],["pontificate","পাণ্ডিত্য জাহির করে উপদেশ দেওয়া","preach,pronounce"],["tacit","অব্যক্ত অথচ বোঝা যায় এমন","implicit,unspoken"],["unease","অস্বস্তি; উদ্বেগ","anxiety,disquiet"],["alleviate","লাঘব করা","mitigate,relieve"],["paranoid","অতিরিক্ত সন্দেহপ্রবণ","suspicious,distrustful"],["merge","একীভূত হওয়া","combine,coalesce"],["fade","ম্লান হয়ে যাওয়া","diminish,wane"]];
starter.push(...[["attenuate","হ্রাস করা","weaken, diminish"],["atavistic","আদিম","primitive, ancestral"],["irascible","বদমেজাজি","choleric, testy"],["quandary","দ্বিধা","dilemma, predicament"],["perspicacious","তীক্ষ্ণবুদ্ধিসম্পন্ন","astute, perceptive"],["flamboyant","জাঁকজমকপূর্ণ","showy, ostentatious"],["profligate","অপব্যয়ী","extravagant, wasteful"],["rectitude","নৈতিক সততা","probity, integrity"],["reprobate","নীতিহীন ব্যক্তি","scoundrel, rogue"],["ineluctable","অনিবার্য","inevitable, unavoidable"],["hackneyed","গতানুগতিক","trite, clichéd"],["foible","ছোট দুর্বলতা","quirk, weakness"],["expedient","সুবিধাজনক","practical, advantageous"],["congenial","মনোরম","agreeable, pleasant"],["raffish","ছন্নছাড়া অথচ আকর্ষণীয়","rakish, unconventional"],["louche","সন্দেহজনক","disreputable, shady"],["ruminative","চিন্তামগ্ন","pensive, contemplative"],["innate","সহজাত","inborn, congenital"],["impetuous","হঠকারী","rash, impulsive"],["palpable","সুস্পষ্ট","tangible, perceptible"],["painstaking","অত্যন্ত যত্নশীল","meticulous, thorough"],["milieu","পরিবেশ","setting, surroundings"],["empiricism","অভিজ্ঞতাবাদ","observation-based inquiry"],["irreverent","শ্রদ্ধাহীন","disrespectful, impious"],["dour","গম্ভীর ও বিষণ্ণ","stern, gloomy"],["supine","নিষ্ক্রিয়","passive, yielding"],["sartorial","পোশাকসংক্রান্ত","clothing-related"],["brandish","আস্ফালন করে দেখানো","wave, flourish"],["dichotomy","দ্বিবিভাজন","division, split"],["egalitarian","সমতাবাদী","equalitarian"],["coercive","বলপ্রয়োগমূলক","compulsory, forceful"],["pedestrian","গতানুগতিক","prosaic, dull"],["perennial","দীর্ঘস্থায়ী","enduring, recurring"],["anodyne","নিরীহ বা প্রশমক","innocuous, soothing"],["abstruse","দুর্বোধ্য","recondite, obscure"],["parsimonious","কৃপণ","stingy, miserly"],["fungible","বিনিময়যোগ্য","interchangeable"],["polemical","বিতর্কমূলক","argumentative"],["obsolete","অচল","outdated, antiquated"],["eloquent","বাগ্মী","articulate, expressive"],["vengeful","প্রতিশোধপরায়ণ","vindictive"],["sanctimony","লোকদেখানো ধার্মিকতা","self-righteousness"],["proficiency","দক্ষতা","competence, expertise"],["inimical","বিরূপ","hostile, adverse"],["complacency","আত্মতুষ্টি","self-satisfaction"],["obdurate","একগুঁয়ে","obstinate, unyielding"],["obtuse","স্থূলবুদ্ধি","dense, insensitive"],["flippant","হালকা ও অসম্মানজনক","frivolous, facetious"],["whimsical","খেয়ালি","capricious, fanciful"],["taciturn","স্বল্পভাষী","reticent, reserved"],["grave","গম্ভীর","solemn, serious"],["jeopardize","বিপন্ন করা","endanger, imperil"],["vitriol","তিক্ত সমালোচনা","acrimony, invective"],["inordinate","অত্যধিক","excessive, disproportionate"],["plaintive","করুণ","mournful, sorrowful"],["minute","অতি ক্ষুদ্র","tiny, infinitesimal"],["latitude","স্বাধীনতার সুযোগ","leeway, freedom"],["fret","উদ্বিগ্ন হওয়া","worry, agonize"],["envelop","আবৃত করা","surround, cloak"],["frantic","উন্মত্ত","frenzied, distraught"],["diffuse","ছড়ানো বা দীর্ঘবাক","dispersed, verbose"],["undermine","দুর্বল করা","subvert, weaken"],["underscore","জোর দেওয়া","emphasize, highlight"],["serene","প্রশান্ত","tranquil, peaceful"],["enigmatic","রহস্যময়","cryptic, mysterious"],["poignant","হৃদয়স্পর্শী","moving, touching"],["innocuous","ক্ষতিহীন","harmless, benign"],["candid","অকপট","frank, forthright"],["assertive","আত্মপ্রত্যয়ী","confident, forceful"],["recondite","দুর্বোধ্য","abstruse, esoteric"]]);
const KEY='khanlyon-gre-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}state.words=state.words||{};state.status=state.status||{};let filter='All';const statuses=['Not Started','Learning','Needs Review','Mastered'];for(const [w,b,s] of starter)if(!state.words[w])state.words[w]={bn:b,syn:s};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){let words=Object.keys(state.words).sort();document.getElementById('stats').innerHTML='<span><b>'+words.length+'</b> words</span>'+statuses.map(s=>'<span>'+s+': <b>'+words.filter(w=>(state.status[w]||'Not Started')===s).length+'</b></span>').join('');document.getElementById('filters').innerHTML=['All',...statuses].map(s=>'<button class="'+(filter===s?'active':'')+'" onclick="setFilter(\''+s+'\')">'+s+'</button>').join('');let q=document.getElementById('search').value.toLowerCase();let found=words.filter(w=>(filter==='All'||(state.status[w]||'Not Started')===filter)&&[w,state.words[w].bn,state.words[w].syn].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=found.map(w=>'<article class="card"><div class="word">'+esc(w)+'</div><div class="bn">'+esc(state.words[w].bn)+'</div><div class="muted">Synonyms: '+esc(state.words[w].syn)+'</div><label>Revision status <select data-word="'+esc(w)+'" onchange="changeStatus(this)">'+statuses.map(s=>'<option '+((state.status[w]||'Not Started')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>').join('')||'<p>No matching words.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setFilter(s){filter=s;render()}function changeStatus(el){state.status[el.dataset.word]=el.value;save();render()}function addWord(){let w=document.getElementById('newword').value.trim().toLowerCase(),bn=document.getElementById('newbn').value.trim(),syn=document.getElementById('newsyn').value.trim();if(!w||!bn){alert('Enter a word and Bengali meaning');return}state.words[w]={bn,syn};save();['newword','newbn','newsyn'].forEach(id=>document.getElementById(id).value='');render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gre-vocabulary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.words||!x.status)throw Error();state=x;save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}document.getElementById('search').addEventListener('input',render);save();render();</script><script>
let round=[],pos=0,score=0;const quiz=document.getElementById('quiz');state.practice=state.practice||{};function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function priority(w){const p=state.practice[w]||{},s=state.status[w]||'Not Started';return ({'Needs Review':4,'Not Started':3,'Learning':2,'Mastered':0}[s]||0)+(p.last&&Date.now()-p.last>604800000?2:0)+(p.last&&Date.now()-p.last<60000?-5:0)+Math.random()}function begin(){round=Object.keys(state.words).sort(()=>0).map(w=>[w,priority(w)]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);pos=0;score=0;question()}function question(){quiz.replaceChildren();if(pos>=round.length){quiz.textContent='Round complete: '+score+'/'+round.length+' correct. Start another round whenever you want.';return}const w=round[pos],d=state.words[w];let title=document.createElement('h3');title.textContent=(pos+1)+' / '+round.length+' — '+w;quiz.append(title);let prompt=document.createElement('p');prompt.textContent='Choose the Bengali meaning:';quiz.append(prompt);let choices=shuffle([d.bn,...shuffle([...new Set(Object.values(state.words).map(x=>x.bn).filter(x=>x!==d.bn))]).slice(0,3)]);for(const c of choices){let b=document.createElement('button');b.textContent=c;b.style.display='block';b.style.margin='8px 0';b.onclick=()=>{for(const a of quiz.querySelectorAll('button'))a.disabled=true;let ok=c===d.bn,p=state.practice[w]||{streak:0};p.streak=ok?(p.streak||0)+1:0;p.last=Date.now();state.practice[w]=p;state.status[w]=ok?(p.streak>=3?'Mastered':'Learning'):'Needs Review';if(ok)score++;save();render();let feedback=document.createElement('p');feedback.textContent=(ok?'Correct! ':'Incorrect. ')+w+' — '+d.bn+' | '+d.syn+' | '+state.status[w];quiz.append(feedback);let next=document.createElement('button');next.textContent='Continue';next.onclick=()=>{pos++;question()};quiz.append(next)};quiz.append(b)}}document.getElementById('startRound').onclick=begin;
</script></body></html>
