<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRE Vocabulary • KhanLyon</title><style>body{font:16px system-ui;background:#f5f7fb;color:#17243b;margin:0}header{background:#152c52;color:white;padding:22px 18px}main{max-width:900px;margin:auto;padding:16px}.stats,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}button{cursor:pointer}.active{background:#234d88;color:white}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 9px #182c4412}.word{font-size:23px;font-weight:750}.bn{font-size:19px;color:#24548b;margin:8px 0}.muted{color:#5c6c81}.stats span{background:white;padding:10px;border-radius:9px}input{box-sizing:border-box;width:100%}small{color:#64748b}label{display:block;margin:8px 0}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header><h1>GRE Vocabulary</h1><div>English • বাংলা অর্থ • Synonyms • Revision tracker</div></header><main><div class="stats" id="stats"></div><input id="search" placeholder="Search English, বাংলা or synonym…"><div class="filters" id="filters"></div><section id="cards"></section><div class="card"><h3>Add a new word</h3><label>Word<input id="newword" placeholder="e.g. obdurate"></label><label>বাংলা অর্থ<input id="newbn" placeholder="বাংলা অর্থ"></label><label>GRE synonyms<input id="newsyn" placeholder="comma-separated synonyms"></label><button onclick="addWord()">Add word</button><p><small>Personal additions and revision progress are saved in this browser. Export a backup before changing devices or clearing browser data.</small></p><button onclick="exportData()">Export my data</button> <label style="display:inline-block">Import backup <input style="width:210px" type="file" accept=".json" onchange="importData(event)"></label></div></main><footer>Built for KhanLyon • GRE preparation</footer><script>
const starter=[["retaliation","প্রতিশোধ","reprisal,vengeance"],["rhetoric","বাগ্মিতা; প্রভাবশালী ভাষা","oratory,eloquence"],["intriguing","কৌতূহলোদ্দীপক; চক্রান্তকারী (প্রসঙ্গভেদে)","fascinating,engaging"],["aggrandize","ক্ষমতা বা মর্যাদা বৃদ্ধি করা","magnify,exalt"],["reconcile","মিটমাট করা; সামঞ্জস্য করা","harmonize,resolve"],["conceal","লুকানো","hide,disguise"],["manipulate","কৌশলে নিয়ন্ত্রণ করা","influence,exploit"],["conspire","ষড়যন্ত্র করা","collude,plot"],["wizened","বয়সে কুঁচকানো; শীর্ণ","wrinkled,shriveled"],["doleful","বিষণ্ণ","mournful,melancholy"],["wistful","আকুল আকাঙ্ক্ষাময়; বিষণ্ণ","yearning,nostalgic"],["baleful","অশুভ; ক্ষতিকর","menacing,malignant"],["fanciful","কল্পনাপ্রসূত","imaginative,unrealistic"],["fruitful","ফলপ্রসূ","productive,rewarding"],["pontificate","পাণ্ডিত্য জাহির করে উপদেশ দেওয়া","preach,pronounce"],["tacit","অব্যক্ত অথচ বোঝা যায় এমন","implicit,unspoken"],["unease","অস্বস্তি; উদ্বেগ","anxiety,disquiet"],["alleviate","লাঘব করা","mitigate,relieve"],["paranoid","অতিরিক্ত সন্দেহপ্রবণ","suspicious,distrustful"],["merge","একীভূত হওয়া","combine,coalesce"],["fade","ম্লান হয়ে যাওয়া","diminish,wane"]];
const KEY='khanlyon-gre-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}state.words=state.words||{};state.status=state.status||{};let filter='All';const statuses=['Not Started','Learning','Needs Review','Mastered'];for(const [w,b,s] of starter)if(!state.words[w])state.words[w]={bn:b,syn:s};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){let words=Object.keys(state.words).sort();document.getElementById('stats').innerHTML='<span><b>'+words.length+'</b> words</span>'+statuses.map(s=>'<span>'+s+': <b>'+words.filter(w=>(state.status[w]||'Not Started')===s).length+'</b></span>').join('');document.getElementById('filters').innerHTML=['All',...statuses].map(s=>'<button class="'+(filter===s?'active':'')+'" onclick="setFilter(\''+s+'\')">'+s+'</button>').join('');let q=document.getElementById('search').value.toLowerCase();let found=words.filter(w=>(filter==='All'||(state.status[w]||'Not Started')===filter)&&[w,state.words[w].bn,state.words[w].syn].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=found.map(w=>'<article class="card"><div class="word">'+esc(w)+'</div><div class="bn">'+esc(state.words[w].bn)+'</div><div class="muted">Synonyms: '+esc(state.words[w].syn)+'</div><label>Revision status <select data-word="'+esc(w)+'" onchange="changeStatus(this)">'+statuses.map(s=>'<option '+((state.status[w]||'Not Started')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>').join('')||'<p>No matching words.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setFilter(s){filter=s;render()}function changeStatus(el){state.status[el.dataset.word]=el.value;save();render()}function addWord(){let w=document.getElementById('newword').value.trim().toLowerCase(),bn=document.getElementById('newbn').value.trim(),syn=document.getElementById('newsyn').value.trim();if(!w||!bn){alert('Enter a word and Bengali meaning');return}state.words[w]={bn,syn};save();['newword','newbn','newsyn'].forEach(id=>document.getElementById(id).value='');render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gre-vocabulary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.words||!x.status)throw Error();state=x;save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}document.getElementById('search').addEventListener('input',render);save();render();</script></body></html>
